<!DOCTYPE html>
<html>
<head>
  <title>Calculadora do 2</title>
  <style>
    body{
      font-family: Arial;
      text-align:center;
      margin-top:100px;
    }

    input{
      padding:10px;
      margin:5px;
      width:80px;
    }

    button{
      padding:10px 20px;
      cursor:pointer;
    }

    h1{
      color:blue;
    }
  </style>
</head>

<body>

<h1>Calculadora que tudo dá 2</h1>

<input type="number" id="n1">
<input type="number" id="n2">

<br><br>

<button onclick="calcular()">Calcular</button>

<h2 id="resultado"></h2>

<script>
function calcular(){
    document.getElementById("resultado").innerText = "Resultado: 2";
}
</script>

</body>
</html>
